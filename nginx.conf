server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/plain text/markdown application/javascript application/json;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex";
    location ~ \.(log|tmp|lock)$ { return 404; }
}
