# Plaud transcripts on an always-on PC: hourly sync plus a viewer page.
#   docker compose up -d --build
# Settings go in a .env file next to this one (see README, Docker section).
name: plaud

services:
  sync:
    build: .
    image: plaud-transcripts
    container_name: plaud-sync
    restart: unless-stopped
    # Plaud's login CLI makes the token folder readable by root only.
    user: root
    environment:
      TZ: ${TZ:-Europe/Berlin}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-3600}
      SYNC_ARGS: ${SYNC_ARGS:-}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      HF_HUB_DISABLE_TELEMETRY: "1"
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      WHISPER_THREADS: ${WHISPER_THREADS:-0}
      WHISPER_DETECT_EVERY: ${WHISPER_DETECT_EVERY:-4}
      DIARIZE: ${DIARIZE:-1}
    volumes:
      - ./library:/app/library
      - models:/models
      # The Plaud login made on the PC; read-write because the token is refreshed in place.
      - ${PLAUD_TOKEN_DIR:-${USERPROFILE}/.plaud}:/plaud

  viewer:
    image: nginx:1.29-alpine
    container_name: plaud-viewer
    restart: unless-stopped
    ports:
      # This PC only by default. Never forward this port to the internet: there is no login.
      - "${VIEWER_BIND:-127.0.0.1}:${VIEWER_PORT:-8765}:80"
    volumes:
      - ./library:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  models:
